name: Release workflow

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-archive:
    name: Build archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run composer install
        run: composer install --no-dev

      - name: Run yarn install
        run: yarn install

      - name: Build project
        run: |
          cd /home/runner/work/formcreator/
          rm -rf formcreator/.git* formcreator/tools formcreator/.yarnrc formcreator/README.md formcreator/composer.* formcreator/package.* formcreator/debian
          tar -zcvf formcreator-${{ github.ref_name }}.tgz formcreator

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: formcreator-${{ github.ref_name }}.tgz
          path: /home/runner/work/formcreator/formcreator-${{ github.ref_name }}.tgz

  build-debian-package:
    name: Build debian package
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y build-essential dpkg-dev debhelper composer npm

      - name: Build DEB Package
        run: |
          sed -i "s/CHANGEVERSION/${GITHUB_REF_NAME#v}/g" debian/rules
          dpkg-buildpackage -us -uc -b
          mv ../itsm-ng-plugin-formcreator_${GITHUB_REF_NAME#v}_all.deb "$GITHUB_WORKSPACE/itsm-ng-plugin-formcreator_${GITHUB_REF_NAME}_all.deb"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: itsm-ng-plugin-formcreator_${{ github.ref_name }}_all.deb
          path: ${{ github.workspace }}/itsm-ng-plugin-formcreator_${{ github.ref_name }}_all.deb

  release:
    runs-on: ubuntu-latest
    needs:
      - build-archive
      - build-debian-package

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: ./dist/*
          body: "New release is available"
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  upload-deb-to-server:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist
          merge-multiple: true

      - name: Upload DEBs to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT_DEB }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          # Définir les distributions en fonction de la version
          DISTROS_DEBIAN="trixie sid"
          DISTROS_UBUNTU="noble resolute"

          for file in ./dist/*.deb; do
            base=$(basename "$file")
            echo "📦 Upload de $base vers le serveur"
            scp -P "$SSH_PORT" "$file" root@"$SSH_HOST":/tmp/

            # Ajout dans toutes les distributions Debian
            for dist in $DISTROS_DEBIAN; do
              echo "➕ Ajout de $base dans Debian $dist"
              ssh -p "$SSH_PORT" root@"$SSH_HOST" \
                "cd /var/www/debian && reprepro -Vb . includedeb $dist /tmp/$base"
            done

            # Ajout dans toutes les distributions Ubuntu
            for dist in $DISTROS_UBUNTU; do
              echo "➕ Ajout de $base dans Ubuntu $dist"
              ssh -p "$SSH_PORT" root@"$SSH_HOST" \
                "cd /var/www/ubuntu && reprepro -Vb . includedeb $dist /tmp/$base"
            done

            # Nettoyage
            ssh -p "$SSH_PORT" root@"$SSH_HOST" "rm -f /tmp/$base"
          done

  create_ticket:
    runs-on: ubuntu-latest
    needs:
      - release
    steps:
      - name: Create ITSM Ticket
        uses: itsmng/itsm-ng_create_ticket_action@master
        with:
          titre: "Release Formcreator"
          contenu: "version: ${{ github.ref_name }} "
          priority: 3
          entite_id: 15
          group_id: 22
          api_url: "https://support.itsm-ng.com/apirest.php"
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
